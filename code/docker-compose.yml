# N360 POC: ClickHouse + Grafana on this Mac. Both bind to 127.0.0.1 only: nothing is reachable
# from the network, and customer data never leaves the laptop.
#
#   cd pipeline/clickhouse
#   cp .env.example .env            # set the two passwords
#   docker compose up -d
#   python3 load.py --rows ../data/<D>/rows --user n360 --password "$N360_CH_PASSWORD"
#   open http://localhost:3000      # Grafana (admin / GRAFANA_ADMIN_PASSWORD)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: n360-clickhouse
    ports:
      - "127.0.0.1:8123:8123"      # HTTP: load.py and Grafana
    environment:
      CLICKHOUSE_USER: n360                          # the loader: read/write
      CLICKHOUSE_PASSWORD: ${N360_CH_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      GRAFANA_CH_PASSWORD: ${GRAFANA_CH_PASSWORD}
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./init/grafana_user.sh:/docker-entrypoint-initdb.d/grafana_user.sh:ro
      - ./clickhouse/memory.xml:/etc/clickhouse-server/config.d/n360_memory.xml:ro        # memory caps:
      - ./clickhouse/query_limits.xml:/etc/clickhouse-server/users.d/n360_limits.xml:ro   # a big query fails, the server lives
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  grafana:
    image: grafana/grafana:13.3.1      # OSS edition (AGPLv3), latest stable 10 Nov 2026; grafana-enterprise is the paid image
    container_name: n360-grafana
    depends_on: [clickhouse]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Installed before Grafana starts; a failed install stops start-up instead of leaving the panels blank.
      # GF_INSTALL_PLUGINS is deprecated in 13.x. Pin the version in .env (empty = latest, not reproducible).
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@${GRAFANA_CH_PLUGIN_VERSION:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The Welcome page is everyone's home page (code/grafana/build_dashboards.py welcome())
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/n360-welcome.json
      GRAFANA_CH_PASSWORD: ${GRAFANA_CH_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/welcome:/usr/share/grafana/public/img/n360:ro     # Welcome page thumbnails (synthetic data)

volumes:
  ch-data:
  grafana-data:
